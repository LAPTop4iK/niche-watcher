name: niche-scan

# Ежедневно 06:17 UTC — tier-1 рынки (us,jp,gb,au,ca,de,tw).
# Пн-Чт 08:17 UTC — tier-2 по слотам (week_slot из markets.json): одна группа за запуск,
#   та, чью поисковую выдачу сканировали дольше всех. GitHub запускает расписание с опозданием
#   на часы, поэтому день недели запуска группу не определяет: поздний или упавший запуск
#   не пропускает и не повторяет группу. Сопоставимость velocity проверяется отдельно.
# Чт — отдельные charts (12 гео) и Play задания; Сб — similar-graph crawl.
# Ежедневно 11:30 UTC — деплой дашборда на GitHub Pages.
# Секреты: TG_BOT_TOKEN, TG_CHAT_ID.

on:
  schedule:
    - cron: "17 6 * * *"     # daily tier-1
    - cron: "17 8 * * 1-4"   # Пн-Чт: tier-2, самый давний слот
    - cron: "17 10 * * 4"    # Чт 10:17: charts + play (после slot 08:17 — БД пишет одна джоба за раз)
    - cron: "17 8 * * 6"     # Сб: similar-graph crawl
    - cron: "30 11 * * *"    # ежедневно: deploy Pages
  workflow_dispatch:
    inputs:
      mode:
        description: "scan: collect; verify: read-only checks; report: send one current summary"
        type: choice
        options: [scan, verify, report]
        default: scan

# Serialize runs even when a previous scan overruns its nominal time slot.
concurrency:
  group: niche-data-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  daily-scan:
    if: github.event.schedule == '17 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run scanner (tier 1 markets)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 scanner.py --report report.md
      - name: Refresh the queue, explore recent-version complaints and broader search strata
        # A partial scan or a failed Telegram delivery must not cost this step.
        if: ${{ !cancelled() }}
        run: python3 demand_check.py --refresh-queue 30 --explore-updated 10 --explore-wide 10 --tier 1 --delay 1.5
      - name: Save collected data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci_save.sh "${{ github.job }} $(date -u +%F)"
      - name: Retain data if saving fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ github.job }}-${{ github.run_attempt }}
          path: niches.db
          retention-days: 7

  weekly-slot:
    if: github.event.schedule == '17 8 * * 1-4'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve slot (the tier-2 group scanned longest ago)
        id: slot
        run: |
          n=$(python3 scanner.py --next-slot)
          echo "Slot $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Run scanner (tier 2, slot)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 scanner.py --tier 2 --slot ${{ steps.slot.outputs.n }} --report report_t2.md
      - name: Refresh the queue, explore recent-version complaints and broader search strata
        # A partial scan or a failed Telegram delivery must not cost this step.
        if: ${{ !cancelled() }}
        run: python3 demand_check.py --refresh-queue 30 --explore-updated 10 --explore-wide 10 --tier 2 --slot ${{ steps.slot.outputs.n }} --delay 1.5
      - name: Save collected data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci_save.sh "${{ github.job }} $(date -u +%F)"
      - name: Retain data if saving fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ github.job }}-${{ github.run_attempt }}
          path: niches.db
          retention-days: 7

  weekly-charts:
    if: github.event.schedule == '17 10 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Chart observations (separate feeds)
        run: python3 charts_scan.py --countries us,jp,gb,au,de,tw,ch,no,se,dk,sa,ae
      - name: Save collected data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci_save.sh "${{ github.job }} $(date -u +%F)"
      - name: Retain data if saving fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ github.job }}-${{ github.run_attempt }}
          path: niches.db
          retention-days: 7

  weekly-play:
    if: github.event.schedule == '17 10 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip3 install --user -r requirements-play.txt
      - name: Play observations
        run: python3 play_scan.py --countries us,de,jp,gb,au --limit 15
      - name: Play review evidence
        run: python3 play_reviews.py --from-db 5 || true
      - name: Save collected data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci_save.sh "${{ github.job }} $(date -u +%F)"
      - name: Retain data if saving fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ github.job }}-${{ github.run_attempt }}
          path: niches.db
          retention-days: 7

  weekly-similar-crawl:
    if: github.event.schedule == '17 8 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: App Store page-link discovery (US)
        run: python3 similar_crawl.py --from-report report.md --top-seeds 5 --depth 1 --country us --out clusters_report_us.md || true
      - name: App Store page-link discovery (GB)
        run: python3 similar_crawl.py --from-report report.md --top-seeds 3 --depth 1 --country gb --out clusters_report_gb.md || true
      - name: Demand check (recent activity, errors stay unknown)
        run: python3 demand_check.py --delay 1.5
      - name: Research queue
        run: python3 scoreboard.py
      - name: Divergence (exploratory)
        run: python3 divergence.py
      - name: Weekly TG digest
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 tg_digest.py --send

      - name: Save collected data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci_save.sh "${{ github.job }} $(date -u +%F)"
      - name: Retain data if saving fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ github.job }}-${{ github.run_attempt }}
          path: niches.db
          retention-days: 7

  verify-pipeline:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regression checks
        run: python3 -m unittest discover -s tests -v
      - name: Clean replay, live source matrix and read-only Telegram checks
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 -u verify_pipeline.py --live --telegram-readonly --out /tmp/pipeline-verification.json
      - name: Keep verification result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-verification
          path: /tmp/pipeline-verification.json
          retention-days: 30

  send-report:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Send the explicitly requested summary only
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 send_report.py --send --event-key "requested-summary:${{ github.run_id }}" --out /tmp/telegram-report-receipt.json
      - name: Retain delivery receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-report-receipt
          path: /tmp/telegram-report-receipt.json
          retention-days: 30
      - name: Save delivery acknowledgement
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci_save.sh "requested report receipt $(date -u +%F)"
      - name: Retain data if saving fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ github.job }}-${{ github.run_attempt }}
          path: niches.db
          retention-days: 7

  deploy-pages:
    needs: [daily-scan, weekly-slot, weekly-charts, weekly-play, weekly-similar-crawl, verify-pipeline, send-report]
    if: always() && (github.event.schedule == '30 11 * * *' || contains(needs.*.result, 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build dashboard
        run: python3 dashboard.py --repo ${{ github.repository }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
