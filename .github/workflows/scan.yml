name: niche-scan

# Ежедневно 06:17 UTC — tier-1 рынки (us,jp,gb,au,ca,de,tw).
# Пн-Чт 08:17 UTC — tier-2 по слотам (week_slot из markets.json): одна группа в день,
#   каждый гео сканируется стабильно раз в неделю в свой день → чистая velocity.
# Чт — также charts (11 гео) + play; Сб — similar-graph crawl.
# Ежедневно 11:30 UTC — деплой дашборда на GitHub Pages.
# Секреты: TG_BOT_TOKEN, TG_CHAT_ID.

on:
  schedule:
    - cron: "17 6 * * *"     # daily tier-1
    - cron: "17 8 * * 1-4"   # Пн-Чт: tier-2 слот дня
    - cron: "17 8 * * 4"     # Чт: + charts + play
    - cron: "17 8 * * 6"     # Сб: similar-graph crawl
    - cron: "30 11 * * *"    # ежедневно: deploy Pages
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-scan:
    if: github.event.schedule == '17 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run scanner (tier 1 markets)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 scanner.py --report report.md
      - name: Commit DB & report
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git add niches.db report.md
          git commit -m "daily scan $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push

  weekly-slot:
    if: github.event.schedule == '17 8 * * 1-4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve slot (1-4, Пн-Чт)
        id: slot
        run: echo "n=$(date +%u)" >> "$GITHUB_OUTPUT"
      - name: Run scanner (tier 2, slot)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 scanner.py --tier 2 --slot ${{ steps.slot.outputs.n }} --report report_t2.md
      - name: Commit DB & report
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git add niches.db report_t2.md
          git commit -m "weekly slot ${{ steps.slot.outputs.n }} $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push

  weekly-charts-play:
    if: github.event.schedule == '17 8 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip3 install --user google-play-scraper
      - name: Chart decay scan (money geos)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 charts_scan.py --countries us,jp,gb,au,de,tw,ch,no,se,dk,sa,ae
      - name: Play zombie scan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 play_scan.py --countries us,de,jp,gb,au --limit 15
      - name: Play reviews mining (жалобы на живых лидеров Play)
        run: python3 play_reviews.py --from-db 5 || true
      - name: Commit DB & reports
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git add niches.db charts_report.md
          git commit -m "weekly charts+play $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push

  weekly-similar-crawl:
    if: github.event.schedule == '17 8 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Similar-graph decay crawl (топ-зомби)
        run: python3 similar_crawl.py --from-report report.md --top-seeds 5 --depth 1 --country us || true
      - name: Similar-graph crawl (GB)
        run: python3 similar_crawl.py --from-report report.md --top-seeds 3 --depth 1 --country gb || true
      - name: Weekly TG digest (динамика)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 tg_digest.py --send || true
      - name: Scoreboard (сводный рейтинг возможностей)
        run: python3 scoreboard.py || true
      - name: Commit report
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git add clusters_report.md
          git commit -m "weekly crawl $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push

  deploy-pages:
    if: github.event.schedule == '30 11 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip3 install matplotlib
      - name: Build dashboard
        run: python3 dashboard.py --repo ${{ github.repository }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
